<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8"/>
	<title>DirectOtp 직접입력</title>
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
	<style id="applicationStylesheet" type="text/css">
    #wrap{
        background-color: #ffffff;

        min-width: 280px;
        /*최소 넓이*/
        max-width: 600px;
        /*최대 넓이*/
        min-height: 668px;
        max-height: 1080px;
        margin-right: auto;
        margin-left: auto;
    }

	#all_area {
		padding-left:20px;
		padding-right:20px;
	}

	.section {
		display: flex;
		padding-left:30px;
	}

	.section_number {
		font-weight: bold;
		font-size: 20px;
		text-align: left;
		font-family: Noto Sans CJK KR;
		font-style: normal;
		color: rgba(0,75,141,1);
		letter-spacing: -0.2px;
	}

	.section_title {
		font-weight: bold;
		font-size: 18px;
		text-align: left;
		font-family: Noto Sans CJK KR;
		font-style: normal;
		color: #707070;
		letter-spacing: -0.2px;
	}

	.section_contents
	{
		left: 0px;
		top: 0px;
		line-height: 30px;
		text-align: left;
		font-family: Noto Sans CJK KR;
		font-style: normal;
		font-weight: normal;
		font-size: 14px;
		color: rgba(112,112,112,1);
		letter-spacing: -0.2px;
		padding-right:10px;
	}

	.section_image {
		margin-top: 15px;
	}

	.hr_style {
		width: 98%;
		border-color:#fefefe;
	}

	</style>
	<script id="applicationScript">
	$(document).ready(function(){
		$("#back").on("click", function() {
			window.HybridApp.goBack();
		});
	});


	function regist() {
		var componetStr = document.getElementById("componetId").value;
		var siteId = document.getElementById("siteId").value;
		if (siteId == "") {
			siteId = "etk";
		}

		var cmdId = "sm";
		var userId = document.getElementById("userId").value;
		if (userId == "") {
			userId = "guest";
		}

//		var otpKey = document.getElementById("otpKey").value;
//		if (otpKey.lenth() < 40) {
//			alert("otpKey");
//		}

		var otpKey = "C45782AA84DA47F6566FD89A4DEF28C93E46B8DD";
		otpKey = "47B5D6D731D3BE9962DE137BB7CCCEC830E1A42A"; //hda_test1 실전용

		var msg = 'directotp://' + componetStr + '/' + siteId + '?' + cmdId + '=' + userId + ';' + otpKey + ';...;U';
		//alert(msg);

		channel.postMessage("register#" + msg);

	}

	function cancle() {
		channel.postMessage("back#OK");
	}


	</script>

	
</head>
<body>
<div id="wrap">
<br/><br/><br/><br/><br/><br/>
	<div id="all_area">
		<div class="section_title">
			<p><span class="section_number">01.</span>
				<span> 사용자 등록 방법 2</span></p>
		</div>

		<div class="section">
			<div class="section_contents">
				<p><span>직접 입력을 통한 사용자 등록은 테스트를 위해서 콤포넌트별 각 항목의 내용을 간편히 입력하기 위한 기능입니다. </span></p>
			</div>

		</div>

		<hr class="hr_style"> <br />

		<div class="section_title">
			<p><span class="section_number">02. </span>
				<span>필수 입력 사항</span></p>
		</div>

		<div class="sectionx">
			<div class="section_contents">
				<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;콤포넌트 타입: &nbsp;&nbsp;&nbsp;<select name="component" id="componetId" style="width:155px;">
					<option value="totp">TOTP</option>
					<option value="dynamicotp">다이나믹OTP</option>
					<option value="qrlogin">QR 로그인</option>
					<option value="qrcheckin">QR 체크인</option>
				</select>
				</p>
			</div>

			<div class="section_contents">
				<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;사이트 ID:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="text" id="siteId" style="width:150px;"/></p>
			</div>
			<div class="section_contents">
				<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;사용자 ID:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="text" id="userId" style="width:150px;"/></p>
			</div>
			<div class="section_contents">
				<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;OTP 비밀키:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="text" id="otpKey"  style="width:150px;"/></p>
			</div>
			<br/>
		</div>

		<hr class="hr_style"> 

<br /><br/>
			<button class="favorite styled" style="width:100px; height:30px;"  type="button" onclick="regist();"> 등록</button>
			<button class="favorite styled" style="width:100px; height:30px;"  type="button" onclick="cancle();"> 취소</button>


	</div>

</div>
</body>
</html>
